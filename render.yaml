services:
  - type: web
    name: agriguard-ai-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: MODEL_PATH
        value: ./ml_weights/mobilenetv2_plantvillage.pth
      - key: CONFIDENCE_THRESHOLD
        value: "0.60"
      - key: CORS_ORIGINS
        value: "https://agriguard-ai.vercel.app,http://localhost:5173,http://localhost:3000"
      - key: ENABLE_IMAGE_STORAGE
        value: "true"
      - key: UPLOAD_DIR
        value: ./uploads
